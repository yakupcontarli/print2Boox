<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <style>
      * { 
        padding: 0; 
        margin: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: #333;
        width: 260px;
        padding: 12px;
        background-color: #fafafa;
      }

      .header {
        display: flex;
        align-items: center;
        margin-bottom: 10px;
        padding-bottom: 8px;
        border-bottom: 1px solid #e0e0e0;
      }

      .header h3 {
        color: #f15a24;
        font-size: 16px;
        font-weight: 600;
      }

      .user-panel {
        display: none;
        background: #e8f5e9;
        border: 1px solid #a5d6a7;
        padding: 10px;
        border-radius: 6px;
        margin-bottom: 10px;
      }

      .user-info {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .avatar {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        object-fit: cover;
      }

      .user-details {
        flex: 1;
        overflow: hidden;
      }

      .user-name {
        font-weight: 600;
        font-size: 13px;
        color: #2e7d32;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .site-domain {
        font-size: 11px;
        color: #558b2f;
      }

      .btn-logout {
        display: inline-block;
        margin-top: 6px;
        font-size: 11px;
        color: #d32f2f;
        text-decoration: none;
        cursor: pointer;
      }

      .action-section {
        display: none;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 10px;
      }

      .btn-primary {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        width: 100%;
        padding: 9px 12px;
        background: #1976d2;
        color: #fff;
        border: none;
        border-radius: 5px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
      }
      .btn-primary:hover {
        background: #1565c0;
      }

      .btn-secondary {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        width: 100%;
        padding: 8px 12px;
        background: #fff;
        color: #333;
        border: 1px solid #ccc;
        border-radius: 5px;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.2s;
      }
      .btn-secondary:hover {
        background: #f0f0f0;
      }

      .login-section {
        background: #fff;
        padding: 10px;
        border: 1px solid #e0e0e0;
        border-radius: 6px;
      }

      .login-title {
        font-size: 12px;
        color: #555;
        margin-bottom: 8px;
        line-height: 1.4;
      }

      .login-list {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .login-btn {
        display: block;
        padding: 7px 10px;
        background: #f5f5f5;
        color: #1976d2;
        text-decoration: none;
        border-radius: 4px;
        font-size: 12px;
        font-weight: 500;
        border: 1px solid #ddd;
        text-align: center;
      }
      .login-btn:hover {
        background: #e3f2fd;
      }

      .sync-btn {
        display: block;
        width: 100%;
        margin-top: 8px;
        padding: 6px;
        background: #fff;
        color: #2e7d32;
        border: 1px dashed #4caf50;
        border-radius: 4px;
        font-size: 11px;
        font-weight: 500;
        cursor: pointer;
        text-align: center;
      }
      .sync-btn:hover {
        background: #f1f8e9;
      }

      #status_msg {
        display: none;
        margin-top: 6px;
        font-size: 11px;
        text-align: center;
      }

      .footer-note {
        margin-top: 8px;
        font-size: 11px;
        color: #777;
        line-height: 1.3;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h3>Print to Boox</h3>
    </div>

    <!-- Giriş Yapıldı Paneli -->
    <div id="user_panel" class="user-panel">
      <div class="user-info">
        <img id="avatar" class="avatar" src="images/icon-48.png" />
        <div class="user-details">
          <div id="user_name" class="user-name">Giriş Yapıldı</div>
          <div id="site_domain" class="site-domain"></div>
        </div>
      </div>
      <a id="btn_logout" class="btn-logout" href="#">Oturumu Kapat / Değiştir</a>
    </div>

    <!-- Hızlı İşlemler Butonları (Giriş Yapıldığında Görünür) -->
    <div id="action_section" class="action-section">
      <button id="btn_push_url" class="btn-primary">
        <span>🌐</span> Bu Sayfayı Boox'a Gönder (PushRead)
      </button>
      <button id="btn_print_pdf" class="btn-secondary">
        <span>📄</span> Sayfayı PDF Olarak Yazdır (Ctrl+P)
      </button>
      <div id="action_status" style="display:none; font-size:11px; text-align:center; padding:4px;"></div>
    </div>

    <!-- Giriş Yapılmadığında Gözükecek Bölüm -->
    <div id="login_section" class="login-section">
      <p class="login-title">Boox hesabınızla giriş yapın:</p>
      <ul class="login-list">
        <li><a id="gotoLogin_pb" class="login-btn" href="#">🌐 Global (push.boox.com)</a></li>
        <li><a id="gotoLogin_eur" class="login-btn" href="#">🇪🇺 EUR (eur.boox.com)</a></li>
        <li><a id="gotoLogin_us" class="login-btn" href="#">🇺🇸 US (us.boox.com)</a></li>
        <li><a id="gotoLogin_s2b" class="login-btn" href="#">🇨🇳 Çin (send2boox.com)</a></li>
      </ul>
      
      <button id="btn_sync" class="sync-btn">🔄 Açık Boox Sekmesini Tara & Bağlan</button>
      <div id="status_msg"></div>
    </div>

    <p class="footer-note">Web sayfalarında sağ tıklayarak da <b>Boox'a Gönder</b> seçeneğini kullanabilirsiniz.</p>

    <script src="popup.js"></script>
  </body>
</html>
